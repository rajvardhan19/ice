name: Bug report
description: Something isn't working the way the docs say it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Two things save a lot of round-trips:
        the **Job Finder › Check setup** output, and the failing entry from
        **Extensions › Apps Script › Executions**.

        ⚠️ **Redact before you paste.** Both can contain Drive IDs, your email
        address, and recruiters' contact details.

  - type: checkboxes
    id: preflight
    attributes:
      label: Before filing
      options:
        - label: I checked [Troubleshooting](https://github.com/rajvardhan19/malik-finder/blob/main/docs/TROUBLESHOOTING.md)
          required: true
        - label: I ran **Job Finder › Check setup**
          required: true
        - label: I'm on the latest `JobTrackerSync.gs` from `main`
          required: false

  - type: dropdown
    id: half
    attributes:
      label: Which half is failing?
      options:
        - Sync (Apps Script) — the tracker isn't updating
        - Discovery (agent) — nothing appears in Drive
        - Email (digest or outreach)
        - Calendar (interviews, deadlines, follow-ups)
        - Setup / authorisation
        - Not sure
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Set Config key '…' to '…'
        2. Job Finder › Sync now
        3. …
    validations:
      required: true

  - type: textarea
    id: check-setup
    attributes:
      label: "`Check setup` output"
      description: Redacted — replace folder IDs and addresses with placeholders.
      render: text

  - type: textarea
    id: logs
    attributes:
      label: Execution log
      description: The failing entry from Apps Script › Executions. Redacted.
      render: text

  - type: input
    id: runner
    attributes:
      label: Discovery runner
      placeholder: Claude cloud routine / GitHub Actions / manual / n-a

  - type: dropdown
    id: account
    attributes:
      label: Google account type
      options:
        - Personal (gmail.com)
        - Workspace (organisation-managed)
        - Not sure
